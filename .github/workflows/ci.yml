name: CI

on:
  pull_request:
    branches:
      - main
      - Release
  push:
    branches:
      - main
      - Release

  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AgentsBridge.slnx

      - name: Build
        run: dotnet build AgentsBridge.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution AgentsBridge.slnx --configuration Release --no-build --no-restore

      - name: Verify formatting
        run: dotnet format AgentsBridge.slnx --no-restore --verify-no-changes