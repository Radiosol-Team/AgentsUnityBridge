name: Build and release

on:
  push:
    branches:
      - release

  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  package:
    name: Package ${{ matrix.rid }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64

          - runner: ubuntu-latest
            rid: linux-x64

          - runner: macos-latest
            rid: osx-x64

          - runner: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.runner }}

    env:
      RELEASE_VERSION: 0.2.${{ github.run_number }}.${{ github.run_attempt }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish desktop and daemon
        shell: pwsh
        run: |
          $package = Join-Path $PWD "package"
          $daemon = Join-Path $package "daemon"
          $artifacts = Join-Path $PWD "artifacts"

          New-Item -ItemType Directory -Force $daemon | Out-Null
          New-Item -ItemType Directory -Force $artifacts | Out-Null

          dotnet publish src/AgentsBridge.Desktop/AgentsBridge.Desktop.csproj `
            --configuration Release `
            --runtime "${{ matrix.rid }}" `
            --self-contained true `
            -p:Version="$env:RELEASE_VERSION" `
            --output $package

          dotnet publish src/AgentsBridge.Daemon/AgentsBridge.Daemon.csproj `
            --configuration Release `
            --runtime "${{ matrix.rid }}" `
            --self-contained true `
            -p:Version="$env:RELEASE_VERSION" `
            --output $daemon

          Copy-Item README.md $package

          Compress-Archive `
            -Path "$package/*" `
            -DestinationPath "$artifacts/AgentsBridge-${{ matrix.rid }}.zip"

          if ("${{ matrix.rid }}" -eq "win-x64") {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) {
              choco install innosetup --version=6.7.1 -y --no-progress
            }

            & $iscc `
              "/DAppVersion=$env:RELEASE_VERSION" `
              "/DSourceDir=$package" `
              "installer/AgentsBridge.iss"

            $setup = Join-Path $artifacts "AgentsBridge-win-x64-setup.exe"
            $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -NoNewline `
              -Path "$setup.sha256" `
              -Value "$hash  AgentsBridge-win-x64-setup.exe"
          }

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: AgentsBridge-${{ matrix.rid }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.2.${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AgentsBridge $RELEASE_TAG" \
            --generate-notes
