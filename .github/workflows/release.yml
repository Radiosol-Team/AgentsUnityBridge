name: Build and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AgentsBridge.slnx

      - name: Build
        run: dotnet build AgentsBridge.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution AgentsBridge.slnx --configuration Release --no-build --no-restore

      - name: Verify formatting
        run: dotnet format AgentsBridge.slnx --no-restore --verify-no-changes

  package:
    name: Package ${{ matrix.rid }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: macos-latest
            rid: osx-x64
          - runner: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish desktop and daemon
        shell: pwsh
        run: |
          $package = Join-Path $PWD "package"
          $daemon = Join-Path $package "daemon"
          New-Item -ItemType Directory -Force $daemon | Out-Null

          dotnet publish src/AgentsBridge.Desktop/AgentsBridge.Desktop.csproj `
            --configuration Release `
            --runtime "${{ matrix.rid }}" `
            --self-contained true `
            --output $package

          dotnet publish src/AgentsBridge.Daemon/AgentsBridge.Daemon.csproj `
            --configuration Release `
            --runtime "${{ matrix.rid }}" `
            --self-contained true `
            --output $daemon

          Copy-Item README.md $package
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path "$package/*" -DestinationPath "artifacts/AgentsBridge-${{ matrix.rid }}.zip"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: AgentsBridge-${{ matrix.rid }}
          path: artifacts/AgentsBridge-${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AgentsBridge $RELEASE_TAG" \
            --generate-notes
